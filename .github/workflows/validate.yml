name: Validate skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/email-marketing/scripts/preview.py skills/email-marketing/assets/preview.json --html /tmp/email-preview.html
